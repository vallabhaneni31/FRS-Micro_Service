# .github/workflows/security-scan.yml — FIX-029 / FIX-030 / FIX-031 / FIX-033
# Comprehensive security CI pipeline:
#   - Secret scanning (gitleaks)
#   - Dependency audit (npm audit + Snyk)
#   - SAST (Semgrep)
#   - Container scanning (Trivy)
#   - DAST (OWASP ZAP) — on PR to main only

name: Security Scan

on:
  push:
    # FIX: this workflow only ever triggered on `main`, but `dev` is this
    # repo's actual default/trunk branch (`origin/HEAD -> origin/dev`) —
    # meaning this entire security pipeline had likely never run against
    # real day-to-day development. `main` is kept in case it's used for
    # releases later, but `dev` is what actually needs coverage.
    branches: [main, dev, "fix/**", "feature/**"]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC

permissions:
  contents: read
  security-events: write   # for SARIF upload
  pull-requests: write     # for ZAP PR comments

jobs:
  # ── Secret Scanning ───────────────────────────────────────────────────────────
  secret-scan:
    name: "🔐 Secret Scan (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Dependency Vulnerability Audit ───────────────────────────────────────────
  dep-audit:
    name: "🛡️ Dependency Audit (npm audit + Snyk) [${{ matrix.service }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, api-retail]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install backend dependencies
        run: cd backend/${{ matrix.service }} && npm ci --ignore-scripts

      - name: npm audit (fail on high/critical)
        run: cd backend/${{ matrix.service }} && npm audit --audit-level=high
        # FIX-030: Gate on high severity — adjust to 'critical' once baseline is clean

      - name: Snyk vulnerability scan
        uses: snyk/actions/node@master
        continue-on-error: true   # non-blocking until Snyk baseline established
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/${{ matrix.service }}/package.json

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # ── SAST (Semgrep) ────────────────────────────────────────────────────────────
  sast:
    name: "🔍 SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:1.62.0
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (FRS custom rules + OWASP top 10)
        run: |
          semgrep \
            --config .semgrep/frs-security-rules.yml \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --sarif \
            --output semgrep.sarif \
            backend/api/src/ \
            backend/api-retail/src/
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ── Container Scanning (Trivy) ────────────────────────────────────────────────
  container-scan:
    name: "🐳 Container Scan (Trivy) [${{ matrix.service }}]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, api-retail]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t frs-${{ matrix.service }}:scan -f backend/${{ matrix.service }}/Dockerfile backend/${{ matrix.service }}/
        continue-on-error: true   # Dockerfile may not exist yet (FIX-032)

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "frs-${{ matrix.service }}:scan"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
        continue-on-error: true

  # ── DAST — OWASP ZAP (PRs to main or dev) ────────────────────────────────────
  dast:
    name: "🌐 DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')
    needs: [secret-scan, dep-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Start backend in test mode
        run: |
          cd backend/api
          cp .env.example .env.test 2>/dev/null || true
          echo "NODE_ENV=test" >> .env.test
          echo "PORT=3001" >> .env.test
          npm ci --ignore-scripts
          NODE_ENV=test node src/server.js &
          sleep 10
        continue-on-error: true

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:3001/api"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-I -j"
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_number }}
          path: report_html.html
