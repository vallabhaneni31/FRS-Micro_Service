<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Connection — FRS Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020817;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2.5rem 3rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      text-align: center;
      max-width: 360px;
    }
    .icon {
      width: 3rem;
      height: 3rem;
      color: #6366f1;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; }
    p  { font-size: 0.875rem; line-height: 1.5; color: #94a3b8; }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1.5rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 3l18 18M8.111 8.111A5.972 5.972 0 006 12a6 6 0 006 6c1.49 0 2.853-.543 3.889-1.436M19.071 4.929A12 12 0 014.929 19.07M12 3a9 9 0 019 9 8.97 8.97 0 01-2.343 6.014" />
    </svg>
    <h1>You're offline</h1>
    <p>Check your network connection and try again. Your data will sync automatically when you reconnect.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
